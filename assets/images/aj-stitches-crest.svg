<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
<title id="title">AJ Stitches — Culture &amp; Lifestyle Hub</title>
<desc id="desc">A refined crowned gold circular fashion-house crest with intertwined A and J monogram, sewing needle and thread details.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4c8"/><stop offset=".24" stop-color="#d8b45a"/><stop offset=".52" stop-color="#a87924"/><stop offset=".76" stop-color="#f0d78d"/><stop offset="1" stop-color="#9a6b22"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d4937"/><stop offset="1" stop-color="#031d17"/></linearGradient>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- crown -->
<g fill="url(#gold)" stroke="#9c742d" stroke-width="2" stroke-linejoin="round">
 <path d="M365 111 L337 43 L405 82 L450 22 L495 82 L563 43 L535 111 Z"/>
 <path d="M354 116 H546 L531 143 H369 Z"/>
 <circle cx="337" cy="42" r="10"/><circle cx="450" cy="21" r="11"/><circle cx="563" cy="42" r="10"/>
</g>
<!-- circular seal -->
<circle cx="450" cy="535" r="382" fill="url(#green)" stroke="url(#gold)" stroke-width="13"/>
<circle cx="450" cy="535" r="359" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
<circle cx="450" cy="535" r="344" fill="none" stroke="#d8b45a" stroke-width="1.5" stroke-dasharray="1 11" stroke-linecap="round"/>
<path d="M450 183 C260 183 98 340 98 535 C98 730 260 887 450 887 C640 887 802 730 802 535 C802 340 640 183 450 183Z" fill="none" stroke="#d8b45a" stroke-width="1" opacity=".45"/>
<!-- intertwined calligraphic monogram: restrained serif letterforms, not abstract scribbles -->
<g fill="url(#gold)" filter="url(#soft)">
 <text x="278" y="628" font-family="Bodoni MT, Didot, 'Times New Roman', serif" font-size="405" font-style="italic" font-weight="400">A</text>
 <text x="424" y="633" font-family="Bodoni MT, Didot, 'Times New Roman', serif" font-size="420" font-style="italic" font-weight="400">J</text>
</g>
<!-- thread crossing the monogram, finishing in a needle -->
<path d="M300 681 C390 733 485 691 530 614 C571 543 557 448 631 394 C659 374 686 374 708 387" fill="none" stroke="#e4c36d" stroke-width="3.5" stroke-linecap="round"/>
<path d="M697 375 L729 389 L703 411" fill="none" stroke="#e4c36d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M706 384 L730 389" stroke="#fff0bd" stroke-width="1.5"/>
<!-- small stitch marks -->
<g fill="none" stroke="#d8b45a" stroke-width="3" stroke-linecap="round">
 <path d="M186 457 l15 7 M174 493 l15 7 M168 532 l16 2 M174 572 l16 -3 M188 611 l15 -7"/>
 <path d="M714 457 l-15 7 M726 493 l-15 7 M732 532 l-16 2 M726 572 l-16 -3 M712 611 l-15 -7"/>
</g>
<!-- brand typography -->
<path d="M240 715 H660" stroke="url(#gold)" stroke-width="2"/>
<text x="450" y="775" text-anchor="middle" fill="#f0d78d" font-family="Didot, 'Bodoni MT', Georgia, serif" font-size="57" letter-spacing="8">AJ STITCHES</text>
<path d="M315 803 H585" stroke="#b88b39" stroke-width="1.5"/>
<text x="450" y="842" text-anchor="middle" fill="#e5c878" font-family="Arial, sans-serif" font-size="19" letter-spacing="5">CULTURE &amp; LIFESTYLE HUB</text>
</svg>